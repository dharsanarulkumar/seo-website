<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Can We Meet Tomorrow?</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #ff4f81;
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .option-btn {
            background-color: #ff4f81;
            color: white;
        }

        .option-btn:hover {
            background-color: #e63e70;
        }

        .yes-btn {
            background-color: #28a745;
            color: white;
        }

        .yes-btn:hover {
            background-color: #1f8a39;
        }

        .hidden {
            display: none;
        }

        .message {
            font-size: 18px;
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Can we meet tomorrow for...?</h1>

    <div id="mealOptions">
        <button class="btn option-btn" onclick="selectMeal('Breakfast')">Breakfast</button>
        <button class="btn option-btn" onclick="selectMeal('Lunch')">Lunch</button>
        <button class="btn option-btn" onclick="selectMeal('Dinner')">Dinner</button>
    </div>

    <div id="yesOptions" class="hidden">
        <h2 id="selectedMeal"></h2>
        <button class="btn yes-btn" onclick="finalAnswer()">Yes</button>
        <button class="btn yes-btn" onclick="finalAnswer()">Yes</button>
    </div>

    <div id="finalMessage" class="hidden message">
        Yay! It’s a date then ❤️✨  
        I’ll see you tomorrow!
    </div>
</div>

<script>
    function selectMeal(meal) {
        document.getElementById("mealOptions").classList.add("hidden");
        document.getElementById("yesOptions").classList.remove("hidden");
        document.getElementById("selectedMeal").innerText = 
            "So... can we meet for " + meal + "?";
    }

    function finalAnswer() {
        document.getElementById("yesOptions").classList.add("hidden");
        document.getElementById("finalMessage").classList.remove("hidden");
    }
</script>

</body>
</html>
